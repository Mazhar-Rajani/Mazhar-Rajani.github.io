<!-- Project Tile template (Project Name)-->
<!-- Paste between the ADD PROJECT TEMPLATE markers in index.html, then run
     python tools/tag_projects.py to fill in data-tags (the category filters).
     data-section: professional | freelance | personal
     project-origin: studio or client name, or Professional / Freelance / Personal.
     Leave out the <details> block if there are no contributions to list. -->
<article class="project" data-section="personal" data-tags="">
    <a class="project-media" href="https://example.com" target="_blank" rel="noopener" tabindex="-1"><img src="assets/img/fortnite.jpg" alt="" loading="lazy"></a>
    <div class="project-body">
        <p class="project-origin">Personal</p>
        <h3 class="project-title"><a href="https://example.com" target="_blank" rel="noopener">Project Name</a></h3>
        <p class="project-desc">One or two sentences about the project.</p>
        <ul class="project-tech"><li>C#</li><li>Unity</li></ul>
        <details class="project-contrib">
            <summary>My contributions</summary>
            <ul>
                <li class="contrib-item">First contribution</li>
                <li class="contrib-item">Second contribution</li>
            </ul>
        </details>
    </div>
</article>
<!-- Project Tile template End-->
